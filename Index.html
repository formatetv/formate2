<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Get Paid By Playing Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #7b2ff7 0%, #c4318a 55%, #f0197d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Inter', sans-serif;
      padding: 16px 16px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── TOAST NOTIFICATIONS ── */
    #toast-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
      min-height: 120px;
    }

    .toast {
      background: #1a1a2e;
      border-radius: 50px;
      padding: 13px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      animation: toastIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards,
                 toastOut 0.35s ease forwards 3.8s;
      opacity: 0;
      width: 100%;
    }

    .toast-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .toast-dot {
      width: 9px;
      height: 9px;
      background: #2ecc71;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .toast-text {
      font-size: 13.5px;
      color: #ffffff;
      font-weight: 400;
      line-height: 1.35;
    }

    .toast-text strong { font-weight: 700; color: #ffffff; }
    .toast-text .amount { font-weight: 700; color: #ffffff; }

    .toast-time {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .toast-time-dot {
      width: 5px;
      height: 5px;
      background: rgba(255,255,255,0.35);
      border-radius: 50%;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-14px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* ── WHITE CARD ── */
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 28px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(30px, 9vw, 42px);
      font-weight: 900;
      color: #e8321a;
      line-height: 1.1;
      margin-bottom: 14px;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .subtext {
      font-size: 17px;
      color: #333333;
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* ── BUTTONS ── */
    .btn-yes {
      display: block;
      width: 100%;
      padding: 18px;
      background: #e8421a;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 20px rgba(232,66,26,0.35);
      letter-spacing: 0.5px;
    }

    .btn-yes:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(232,66,26,0.45);
    }

    .btn-yes:active { transform: translateY(0); }

    .btn-no {
      display: block;
      width: 100%;
      padding: 18px;
      background: #e8e8e8;
      color: #333333;
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 24px;
      transition: transform 0.15s ease;
      letter-spacing: 0.5px;
    }

    .btn-no:hover { transform: translateY(-1px); }

    /* ── BOTTOM COUNTER ── */
    .counter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .counter-icon svg {
      width: 22px;
      height: 22px;
      fill: #e8321a;
      display: block;
    }

    .counter-number {
      font-family: 'Montserrat', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #e8321a;
    }

    .counter-label {
      font-size: 14px;
      color: #444;
      font-weight: 500;
      line-height: 1.3;
      text-align: left;
    }

    .online-dot {
      width: 10px;
      height: 10px;
      background: #2ecc71;
      border-radius: 50%;
      flex-shrink: 0;
      animation: blink 1.6s ease infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── NO SCREEN ── */
    .reconsider { display: none; }
    .reconsider h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #e8321a;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .reconsider p {
      color: #555;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="card" id="main-card">
    <h1>Get Paid By<br>Playing Games</h1>
    <p class="subtext">Are You Ready To Start?</p>

    <a href="https://chat.whatsapp.com/HkldHaw0KJ1FTguXj8VsyB" target="_blank" rel="noopener" class="btn-yes">YES</a>
    <div class="btn-no" onclick="showNo()">NO</div>

    <div class="counter-row">
      <div class="counter-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
      </div>
      <span class="counter-number" id="online-count">1,330</span>
      <span class="counter-label">People Online Ready<br>to Play</span>
      <div class="online-dot"></div>
    </div>
  </div>

  <div class="card reconsider" id="no-card">
    <h2>Are You Sure?</h2>
    <p>Members are earning <strong style="color:#e8321a">₦6,000 – ₦30,000</strong> weekly just by playing games from their phones. You will miss out if you leave now.</p>
    <a href="https://chat.whatsapp.com/HkldHaw0KJ1FTguXj8VsyB" target="_blank" rel="noopener" class="btn-yes">OK, I Want In</a>
    <div class="btn-no" onclick="window.history.back()">No Thanks</div>
  </div>

  <script>
    const names = [
      "Chidera","Ibrahim","Victor","Amaka","Tunde","Fatima","Emeka",
      "Blessing","Seun","Ngozi","Halima","Rotimi","Kemi","Musa",
      "Adaeze","Usman","Sola","Taiwo","Bello","Precious","Gbenga","Yetunde"
    ];
    const locations = [
      "Lagos","Abuja","Kano","Kebbi","Bayelsa","Enugu","Ibadan",
      "Port Harcourt","Minna","Kaduna","Warri","Ilorin","Jos","Calabar","Owerri"
    ];
    const amounts = [
      "₦12,500","₦8,200","₦19,750","₦6,800","₦24,100","₦11,300",
      "₦15,600","₦9,400","₦31,200","₦7,750","₦18,900","₦22,400"
    ];

    const container = document.getElementById('toast-container');

    function createToast(name, location, amount) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <div class="toast-left">
          <div class="toast-dot"></div>
          <div class="toast-text">
            <strong>${name}</strong> from ${location} just earned <span class="amount">${amount}</span> playing.
          </div>
        </div>
        <div class="toast-time">
          <div class="toast-time-dot"></div>
          <span>now</span>
        </div>
      `;
      return toast;
    }

    function showBatch() {
      while (container.children.length >= 3) {
        container.removeChild(container.firstChild);
      }
      const count = Math.random() > 0.4 ? 2 : 1;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const name = names[Math.floor(Math.random() * names.length)];
          const location = locations[Math.floor(Math.random() * locations.length)];
          const amount = amounts[Math.floor(Math.random() * amounts.length)];
          const toast = createToast(name, location, amount);
          container.appendChild(toast);
          setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 4300);
        }, i * 700);
      }
    }

    showBatch();
    function scheduleNext() {
      const delay = Math.random() * 3000 + 4000;
      setTimeout(() => { showBatch(); scheduleNext(); }, delay);
    }
    scheduleNext();

    let onlineCount = 1330;
    function updateOnline() {
      const change = Math.floor(Math.random() * 9) - 4;
      onlineCount = Math.max(1100, Math.min(1600, onlineCount + change));
      document.getElementById('online-count').textContent = onlineCount.toLocaleString();
    }
    setInterval(updateOnline, 4000);

    function showNo() {
      document.getElementById('main-card').style.display = 'none';
      const noCard = document.getElementById('no-card');
      noCard.style.display = 'block';
    }
  </script>

</body>
  </html>
