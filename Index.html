<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Get Paid By Playing Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #7b2ff7 0%, #c4318a 55%, #f0197d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* TOASTS — fixed position, never touches card */
    #toast-container {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 999;
      pointer-events: none;
    }

    .toast {
      background: #1a1a2e;
      border-radius: 50px;
      padding: 8px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards,
                 toastOut 0.35s ease forwards 3.8s;
      opacity: 0;
      width: 100%;
    }

    .toast-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .toast-dot {
      width: 7px; height: 7px;
      background: #2ecc71;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .toast-text {
      font-size: 11px;
      color: #fff;
      font-weight: 400;
      line-height: 1.3;
    }

    .toast-text strong { font-weight: 700; }

    .toast-time {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
      flex-shrink: 0;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-10px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* CARD — small and centered, never moves */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 24px 22px 22px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.28);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #e8321a;
      line-height: 1.15;
      margin-bottom: 8px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .subtext {
      font-size: 13px;
      color: #444;
      font-weight: 500;
      margin-bottom: 18px;
    }

    /* BUTTONS */
    .btn-yes {
      display: block;
      width: 100%;
      padding: 13px;
      background: #e8421a;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 3px 14px rgba(232,66,26,0.4); }
      50% { box-shadow: 0 3px 24px rgba(232,66,26,0.75), 0 0 18px 5px rgba(232,66,26,0.18); }
    }

    .btn-yes:hover { animation: none; box-shadow: 0 6px 24px rgba(232,66,26,0.6); }

    .btn-no {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px;
      background: #1a1a2e;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 18px;
      line-height: 1.3;
      animation: subtleBounce 3s ease-in-out infinite;
      box-shadow: 0 3px 12px rgba(26,26,46,0.3);
    }

    @keyframes subtleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    /* COUNTER */
    .counter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .counter-icon svg {
      width: 18px; height: 18px;
      fill: #e8321a;
      display: block;
    }

    .counter-number {
      font-family: 'Montserrat', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: #e8321a;
    }

    .counter-label {
      font-size: 11px;
      color: #555;
      font-weight: 500;
      line-height: 1.3;
      text-align: left;
    }

    .online-dot {
      width: 8px; height: 8px;
      background: #2ecc71;
      border-radius: 50%;
      flex-shrink: 0;
      animation: blink 1.6s ease infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .reconsider { display: none; }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="card" id="main-card">
    <h1>GET PAID BY<br>PLAYING GAMES</h1>
    <p class="subtext">Are You Ready To Start?</p>

    <a href="https://chat.whatsapp.com/KgUuS5UFmTDEpXcJkLwZNP" target="_blank" rel="noopener" class="btn-yes">YES</a>
    <a href="https://chat.whatsapp.com/KgUuS5UFmTDEpXcJkLwZNP" target="_blank" rel="noopener" class="btn-no">
      Join WhatsApp Community
      <span style="font-size:11px;font-weight:500;font-family:Inter,sans-serif;margin-top:3px;color:rgba(255,255,255,0.6);">100% Free</span>
    </a>

    <div class="counter-row">
      <div class="counter-icon">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      </div>
      <span class="counter-number" id="online-count">1,330</span>
      <span class="counter-label">Nigerians Playing<br>Games Now</span>
      <div class="online-dot"></div>
    </div>
  </div>

  <div class="card reconsider" id="no-card">
    <h1 style="font-size:20px;margin-bottom:10px;">Are You Sure?</h1>
    <p style="font-size:13px;color:#555;margin-bottom:18px;line-height:1.6;">Members are earning <strong style="color:#e8321a">₦45,000 – ₦1,300,000</strong> playing games from their phones. Don't miss out.</p>
    <a href="https://chat.whatsapp.com/KgUuS5UFmTDEpXcJkLwZNP" target="_blank" rel="noopener" class="btn-yes">OK, I Want In</a>
    <div class="btn-no" onclick="window.history.back()">No Thanks</div>
  </div>

  <script>
    const names = ["Chidera","Ibrahim","Victor","Amaka","Tunde","Fatima","Emeka","Blessing","Seun","Ngozi","Halima","Rotimi","Kemi","Musa","Adaeze","Usman","Sola","Taiwo","Bello","Precious","Gbenga","Yetunde"];
    const locations = ["Lagos","Abuja","Kano","Kebbi","Bayelsa","Enugu","Ibadan","Port Harcourt","Minna","Kaduna","Warri","Ilorin","Jos","Calabar","Owerri"];
    const amounts = ["₦45,200","₦178,500","₦312,000","₦67,800","₦520,400","₦89,100","₦743,600","₦134,200","₦960,000","₦256,800","₦1,100,000","₦1,300,000","₦487,500","₦623,900","₦815,000","₦1,050,000","₦392,700","₦57,300"];
    const banks = ["Opay","Palmpay","Kuda","GTBank","Access Bank","UBA","Moniepoint","FCMB","Zenith","First Bank"];
    const actions = [
      (name, loc, amt, bank) => `<strong>${name}</strong> from ${loc} just withdrew <strong>${amt}</strong> to ${bank}`,
      (name, loc, amt, bank) => `<strong>${name}</strong> from ${loc} cashed out <strong>${amt}</strong> to ${bank}`,
      (name, loc, amt, bank) => `<strong>${name}</strong> from ${loc} transferred <strong>${amt}</strong> to ${bank}`,
      (name, loc, amt, bank) => `<strong>${name}</strong> from ${loc} just received <strong>${amt}</strong> on ${bank}`,
    ];

    const container = document.getElementById('toast-container');

    function createToast(name, location, amount) {
      const bank = banks[Math.floor(Math.random()*banks.length)];
      const action = actions[Math.floor(Math.random()*actions.length)];
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<div class="toast-left"><div class="toast-dot"></div><div class="toast-text">${action(name, location, amount, bank)}.</div></div><div class="toast-time">now</div>`;
      return t;
    }

    function showBatch() {
      while (container.children.length >= 3) container.removeChild(container.firstChild);
      const count = Math.random() > 0.4 ? 2 : 1;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const toast = createToast(
            names[Math.floor(Math.random()*names.length)],
            locations[Math.floor(Math.random()*locations.length)],
            amounts[Math.floor(Math.random()*amounts.length)]
          );
          container.appendChild(toast);
          setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 4300);
        }, i * 700);
      }
    }

    showBatch();
    function scheduleNext() {
      setTimeout(() => { showBatch(); scheduleNext(); }, Math.random()*3000+4000);
    }
    scheduleNext();

    let onlineCount = 1330;
    setInterval(() => {
      onlineCount = Math.max(1100, Math.min(1600, onlineCount + Math.floor(Math.random()*9)-4));
      document.getElementById('online-count').textContent = onlineCount.toLocaleString();
    }, 4000);
  </script>

</body>
</html>
